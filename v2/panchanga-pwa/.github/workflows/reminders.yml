name: Panchanga reminders

on:
  schedule:
    # 07:15 UTC = 02:15 AM CDT / 01:15 AM CST — shortly after each day's panchanga rolls over
    - cron: '15 7 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web-push
        run: npm install web-push --no-save
      - name: Run check
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT_EMAIL: ${{ secrets.VAPID_SUBJECT_EMAIL }}
        run: node push/check-and-notify.js
